name: Unified Test & Report CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  EHR_ROOT: Unified-Secure-Patient-Record-System

jobs:
  verify_deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository layout
        run: |
          test -d "${{ env.EHR_ROOT }}/backend"
          test -d "${{ env.EHR_ROOT }}/frontend"
          test -d load-tests
          test -d selenium-tests
          echo "Repository structure OK"

  run_backend_api_tests:
    needs: verify_deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ env.EHR_ROOT }}/backend/requirements.txt"
          pip install pytest httpx
      - name: Run backend tests
        run: |
          mkdir -p "${{ env.EHR_ROOT }}/reports"
          if [ -d "${{ env.EHR_ROOT }}/backend/tests" ]; then
            pytest "${{ env.EHR_ROOT }}/backend/tests" --junitxml="${{ env.EHR_ROOT }}/reports/backend-junit.xml" || true
          else
            echo "No backend test suite found — wrote CI placeholder report." > "${{ env.EHR_ROOT }}/reports/backend-ci-summary.txt"
          fi
      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-report
          path: ${{ env.EHR_ROOT }}/reports/**
          if-no-files-found: warn

  run_frontend_build:
    needs: verify_deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.EHR_ROOT }}/frontend/package-lock.json
      - name: Install and build frontend
        working-directory: ${{ env.EHR_ROOT }}/frontend
        run: |
          npm ci
          npm run build
          mkdir -p reports
          echo "Frontend build succeeded on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/frontend-build-summary.txt
      - name: Upload frontend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-report
          path: ${{ env.EHR_ROOT }}/frontend/reports/**
          if-no-files-found: warn

  run_api_load_tests:
    needs: verify_deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: load-tests/package-lock.json
      - name: Prepare backend env for Docker
        working-directory: ${{ env.EHR_ROOT }}
        run: |
          # backend/.env is gitignored — compose fails in CI without it
          cat > backend/.env <<'EOF'
          MONGODB_URL=mongodb://mongodb:27017/ehrdb
          JWT_SECRET=ci-test-secret
          JWT_EXPIRE_HOURS=8
          DEMO_ENCRYPTION_PASSWORD=EHR-DEMO-KEY-2024
          GEMINI_API_KEY=
          GEMINI_MODEL=gemini-2.5-flash
          EOF
      - name: Start backend for load tests
        id: start_backend
        continue-on-error: true
        working-directory: ${{ env.EHR_ROOT }}
        run: |
          docker compose up -d --build mongodb backend
          echo "Waiting for backend health..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "Backend is healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose ps || true
          docker compose logs mongodb backend || true
          exit 1
      - name: Run load tests
        working-directory: load-tests
        env:
          CI: true
          LOAD_TEST_DURATION: 15
          LOAD_TEST_CONNECTIONS: 50
        run: |
          npm ci
          npm test
      - name: Stop backend stack
        if: always()
        working-directory: ${{ env.EHR_ROOT }}
        run: docker compose down -v
      - name: Upload load test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: load-tests/reports/**
          if-no-files-found: warn

  run_selenium_e2e:
    needs: verify_deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: selenium-tests/package-lock.json
      - name: Run selenium tests
        working-directory: selenium-tests
        run: |
          npm ci
          npm test
      - name: Upload selenium reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: selenium-tests/reports/**
          if-no-files-found: warn

  consolidate_and_verify_reports:
    needs: [run_backend_api_tests, run_frontend_build, run_api_load_tests, run_selenium_e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-report
          path: artifacts/backend
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-report
          path: artifacts/frontend
      - name: Download load test artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: load-report
          path: artifacts/load
      - name: Download selenium artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selenium-report
          path: artifacts/selenium
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate unified report
        run: node scripts/generate_unified_report.js
      - name: Upload unified dashboard
        uses: actions/upload-artifact@v4
        with:
          name: unified-dashboard
          path: reports/unified_dashboard.html
          if-no-files-found: error
